# ================ Python Things ==============================================
[[language]]
language-servers = ["pyright"]
name             = "python"

# ================ Golang Things ==============================================
[[language]]
auto-format = false
formatter   = { command = "goimports" }
indent      = { tab-width = 2, unit = "  ", use-spaces = true }
name        = "go"

# ================ Web Dev: Traditional Node ==================================
# MAC
#   - brew install vscode-langservers-extracted
#   - npm install -g prettier
#   - npm install -g emmet-ls
# REF: https://www.canofworms.com/technology/2025-08-18-helix-language-support/#language-server-4
[[language]]
auto-format = true
formatter   = { command = "prettier", args = ["--parser", "json"] }
name        = "json"

[[language]]
auto-format      = true
file-types       = ["html", "htm", "njk"]
formatter        = { command = "prettier", args = ["--parser", "html"] }
language-servers = ["vscode-html-language-server", "emmet-ls"]
name             = "html"

[language-server.emmet-ls]
args    = ["--stdio"]
command = "emmet-ls"

[[language]]
auto-format      = true
formatter        = { command = 'prettier', args = ["--parser", "css"] }
language-servers = ["vscode-css-language-server", "emmet-ls"]
name             = "css"

# =============== Kotlin ==============================================
[language-server.kotlin-lsp]
args    = ["--stdio"]
command = "kotlin-language-server"

[[language]]
file-types = ["kt", "kts"]
injection-regex = "kotlin"
language-servers = ["kotlin-lsp"]
name = "kotlin"
roots = [
    "settings.gradle",
    "settings.gradle.kts",
    "build.gradle",
    "build.gradle.kts",
    "pom.xml",
]
scope = "source.kotlin"
shebangs = ["kotlin"]

[[language]]
auto-format = true
file-types  = ["md"]
formatter   = { command = "prettier", args = ["--parser", "markdown"] }
name        = "markdown"

# ======== TOML ==============================================================
[[language]]
file-types      = ["toml", "pdm.lock", "poetry.lock", "Cargo.lock", "uv.lock"]
injection-regex = "toml"
name            = "toml"
scope           = "source.toml"
# Deixe o Helix encontrar a raiz automaticamente ou defina apenas se necessário
auto-format = true
language-servers = ["taplo"]
roots = [
    ".git",
    ".taplo.toml",
    "pyproject.toml",
    "package.json",
    "build.gradle.kts",
]
# Opcional: força o Helix a usar o comando de formatação do LSP
[language.formatter]
args    = ["fmt", "-"]
command = "taplo"
